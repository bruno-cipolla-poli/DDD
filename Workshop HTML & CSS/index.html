<!DOCTYPE html>

<html lang="pt-br">
    <head>
        <title>Fluxo</title>
        <link rel="stylesheet" href="style.css"/>
    </head>

    <body>
        <h1 class="fluxo">FLUXO</h1>

        <div class="tela">
            <h2 class="enter">Entrar</h2>

            <div class="login">
                <input class="dado" type="text" placeholder="Email ou número de celular"></input>
                <input class="senha" type="text" placeholder="Senha"></input>
            </div>

            <div class="bota">
                <button class="in">Entrar</button>
                <button class="code">Usar um código de acceso</button>
            </div>

            <a href="" class="txt">Esqueceu a senha?</a>

            <div class="conta">
            <p class="msg">Novo por aqui?</p>
            <a class="link" href="">Assine agora</a>
            </div>
        </div>

        <footer class="rodape">
            <p>Termo de uso</p>
            <p>Privacidade</p>
        </footer>
    </body>
</html>
